[build-system]
requires = ["setuptools>=80,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "hotel-bot-backend"
version = "0.1.0"
description = "Backend for the AI Hotel Customer Support Bot"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "alembic==1.18.5",
    "asyncmy==0.2.11",
    "cryptography==49.0.0",
    "fastapi==0.139.0",
    "faiss-cpu==1.14.3",
    "google-genai==2.12.1",
    "httpx==0.28.1",
    "numpy==2.5.1",
    "pydantic-settings==2.14.2",
    "sqlalchemy[asyncio]==2.0.51",
    "uvicorn[standard]==0.51.0",
]

[project.optional-dependencies]
dev = [
    "mypy==2.2.0",
    "pytest==9.1.1",
    "ruff==0.15.21",
]
embeddings = [
    "sentence-transformers==5.6.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"hotel_bot.seed" = ["data/*.json"]
"hotel_bot.intent" = ["data/*.json"]
"hotel_bot.knowledge" = ["data/*.json"]

[tool.pytest.ini_options]
addopts = "-q --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
    "integration: requires the project MySQL container on localhost:3307",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true
show_error_codes = true
packages = ["hotel_bot"]
mypy_path = "src"
